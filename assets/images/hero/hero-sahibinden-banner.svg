<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06070d"/>
      <stop offset="45%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.18" cy="0.42" r="0.45">
      <stop offset="0%" stop-color="#1f4fff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#1f4fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.82" cy="0.55" r="0.42">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="45%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glowL)"/>
  <rect width="1920" height="1080" fill="url(#glowR)"/>

  <g opacity="0.35" filter="url(#blur)">
    <ellipse cx="420" cy="560" rx="280" ry="280" fill="#1f4fff" opacity="0.18"/>
    <ellipse cx="1500" cy="420" rx="240" ry="240" fill="#2563eb" opacity="0.14"/>
  </g>

  <g stroke="#1f4fff" stroke-opacity="0.18" stroke-width="1">
    <path d="M0 780 H1920"/>
    <path d="M0 860 H1920"/>
    <path d="M260 0 V1080"/>
    <path d="M1660 0 V1080"/>
  </g>

  <!-- Wheel 1 -->
  <g transform="translate(1180 360)">
    <circle r="190" fill="#0b0f18" stroke="url(#rim)" stroke-width="10"/>
    <circle r="118" fill="none" stroke="#334155" stroke-width="3"/>
    <g stroke="#475569" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-150" x2="0" y2="150"/>
      <line x1="-150" y1="0" x2="150" y2="0"/>
      <line x1="-106" y1="-106" x2="106" y2="106"/>
      <line x1="106" y1="-106" x2="-106" y2="106"/>
    </g>
    <circle r="34" fill="#111827" stroke="#64748b" stroke-width="4"/>
    <ellipse cx="48" cy="-72" rx="120" ry="36" fill="url(#glass)" transform="rotate(-18)"/>
  </g>

  <!-- Wheel 2 -->
  <g transform="translate(520 430)" opacity="0.92">
    <circle r="150" fill="#0a0d14" stroke="url(#rim)" stroke-width="8"/>
    <circle r="92" fill="none" stroke="#334155" stroke-width="2"/>
    <g stroke="#475569" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-118" x2="0" y2="118"/>
      <line x1="-118" y1="0" x2="118" y2="0"/>
      <line x1="-83" y1="-83" x2="83" y2="83"/>
      <line x1="83" y1="-83" x2="-83" y2="83"/>
    </g>
    <circle r="26" fill="#111827" stroke="#64748b" stroke-width="3"/>
  </g>

  <!-- Wheel 3 small -->
  <g transform="translate(1540 690)" opacity="0.75">
    <circle r="96" fill="#0a0d14" stroke="#64748b" stroke-width="6"/>
    <circle r="58" fill="none" stroke="#334155" stroke-width="2"/>
    <g stroke="#475569" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-76" x2="0" y2="76"/>
      <line x1="-76" y1="0" x2="76" y2="0"/>
    </g>
    <circle r="18" fill="#111827"/>
  </g>

  <!-- Tire stack -->
  <g transform="translate(860 690)">
    <ellipse cx="0" cy="42" rx="170" ry="34" fill="#020617" opacity="0.8"/>
    <rect x="-150" y="-18" width="300" height="56" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
    <rect x="-150" y="-38" width="300" height="56" rx="28" fill="#111827" stroke="#334155" stroke-width="3"/>
    <rect x="-150" y="-58" width="300" height="56" rx="28" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <g stroke="#1f4fff" stroke-opacity="0.35" stroke-width="2">
      <path d="M-120 -30 H120"/>
      <path d="M-120 -50 H120"/>
      <path d="M-120 -70 H120"/>
    </g>
  </g>

  <!-- Neon accents -->
  <path d="M120 920 C420 860, 760 980, 1080 900 S1680 860, 1820 920" stroke="#1f4fff" stroke-opacity="0.45" stroke-width="3" fill="none"/>
  <path d="M80 180 C360 240, 720 120, 1100 200 S1650 260, 1840 180" stroke="#60a5fa" stroke-opacity="0.22" stroke-width="2" fill="none"/>

  <!-- Floor reflection -->
  <rect x="0" y="880" width="1920" height="200" fill="url(#glass)" opacity="0.35"/>
  <ellipse cx="960" cy="930" rx="720" ry="48" fill="#1f4fff" opacity="0.08"/>
</svg>
