      <stop offset="0%" stop-color="#04060c"/>
      <stop offset="40%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#030408"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.22" cy="0.38" r="0.5">
      <stop offset="0%" stop-color="#1f4fff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#1f4fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.78" cy="0.62" r="0.45">
